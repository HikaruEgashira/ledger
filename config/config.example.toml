# Copy to config/config.toml (gitignored) and fill in values for this machine / organization.
org = "example-org"
ghtkn_read_app = "example-org/read"
launchd_label_prefix = "com.example"
notify_slack_user = "U00000000"
# Optional: enable GitHub auto-merge on your own open non-draft PRs (write-capable GHTKN app).
# authored_auto_merge_app = "example-org/write"
# Optional: queue your own PRs whose ball is with you (CI failed, conflicts, reviewer responded, no reviewer)
# and answer them with skills/respond-authored-prs/SKILL.md using worker_command.
# authored_respond = true
# Optional: treat work-tool items as tasks on the same queue (skills/sync-tasks, skills/respond-tasks).
# Each tool is a connector under skills/sources/<name>/SOURCE.md reached through its MCP server; add a directory to add a tool.
# review axis = someone asked you; respond axis = you asked someone. Workers reply/update fully automatically.
# tasks_respond = true
# Connectors to sync (default: every connector under skills/sources).
# task_sources = ["slack", "jira"]
# Extra search terms per connector (own names/handles, watched topics): task_<name>_keywords; hits go to triage.
# task_slack_keywords = ["your-handle", "\"exact phrase\""]
# Alert channels per connector (channel IDs): every alert posted there becomes a review task to investigate and fix.
# task_slack_alert_channels = ["C00000000"]
# Run launchd jobs only in this hour window (start inclusive, end exclusive); omit to run always.
# active_hours_start = 9
# active_hours_end = 18
# active_hours_tz = "Asia/Tokyo"
# Optional: tell enrolled authors what to do on PRs waiting on them (conflicts, red CI, change requests, open threads).
# nudge_authors = ["teammate-login"]
# nudge_interval_hours = 24
# nudge_app = "example-org/write"  # defaults to authored_auto_merge_app
exclude_authors = ["your-github-login"]
worker_command = [
  "/usr/bin/env",
  "LANG=en_US.UTF-8",
  "claude",
  "--permission-mode", "auto",
  "--output-format", "stream-json",
  "--verbose",
  "-p",
  "/review-ledger-prs Process the ledger targets exactly once, then exit.",
]

# Team scopes polled by app/src/review-poller.ts. Use exactly one of repo or authors (+ repos); optional title narrows by PR title.
[[scopes]]
name = "team-repo"
repo = "example-org/example-repo"
profile = "skills/review-ledger-prs/references/team-review-profile.md"

[[scopes]]
name = "team-authors"
authors = ["teammate-login"]
repos = ["example-org/another-repo"]
profile = "skills/review-ledger-prs/references/team-review-profile.md"
