<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>reviewctl</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href='data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"%3E %3Cdefs%3E %3ClinearGradient id="bg" x1="0" y1="0" x2="1" y2="1"%3E %3Cstop offset="0" stop-color="%237c86ff"/%3E %3Cstop offset="1" stop-color="%233b3f9e"/%3E %3C/linearGradient%3E %3ClinearGradient id="ck" x1="0" y1="0" x2="1" y2="1"%3E %3Cstop offset="0" stop-color="%236ee7a8"/%3E %3Cstop offset="1" stop-color="%234cb782"/%3E %3C/linearGradient%3E %3C/defs%3E %3Crect width="64" height="64" rx="14" fill="url%28%23bg%29"/%3E %3Crect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="%23fff" stroke-opacity=".18" stroke-width="2"/%3E %3Cg fill="none" stroke="%23f7f8f8" stroke-width="4" stroke-linecap="round"%3E %3Cpath d="M20 18v28"/%3E %3Cpath d="M20 26c0 8 8 10 16 10"/%3E %3C/g%3E %3Ccircle cx="20" cy="16" r="5" fill="%2308090a" stroke="%23f7f8f8" stroke-width="3.5"/%3E %3Ccircle cx="20" cy="48" r="5" fill="%2308090a" stroke="%23f7f8f8" stroke-width="3.5"/%3E %3Ccircle cx="44" cy="40" r="12" fill="%2308090a"/%3E %3Cpath d="M38.5 40.5l4 4 7.5-8.5" fill="none" stroke="url%28%23ck%29" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/%3E %3C/svg%3E'
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #08090a;
        --panel: #0f1011;
        --card: #151619;
        --card-hover: #1b1c20;
        --border: #23252a;
        --text: #f7f8f8;
        --muted: #8a8f98;
        --faint: #62666d;
        --accent: #5e6ad2;
        --red: #eb5757;
        --yellow: #f2c94c;
        --green: #4cb782;
        --blue: #4ea7fc;
        --gray: #6b6f76;
        --s1: #3987e5;
        --s2: #d95926;
        --s3: #199e70;
        --s4: #c98500;
        --s5: #8a63d2;
        --s6: #d0457a;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font:
          13px/1.4 "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        -webkit-font-smoothing: antialiased;
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      nav {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 10px 12px 0;
      }
      .seg {
        display: flex;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 2px;
      }
      .seg button {
        background: none;
        border: 0;
        color: var(--muted);
        font: inherit;
        padding: 3px 10px;
        border-radius: 4px;
        cursor: pointer;
      }
      .seg button.on {
        background: var(--card-hover);
        color: var(--text);
      }
      .kind {
        display: flex;
        gap: 8px;
        font-size: 12px;
      }
      .kind label {
        display: flex;
        align-items: center;
        gap: 4px;
        cursor: pointer;
      }
      .card.mine {
        border-left: 3px solid var(--accent);
      }
      select {
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        font: inherit;
        padding: 4px 8px;
      }
      .avatar {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: var(--border);
        flex: none;
      }
      #board {
        display: flex;
        gap: 8px;
        padding: 12px;
        flex: 1;
        min-height: 0;
        overflow-x: auto;
      }
      .col {
        flex: 0 0 300px;
        display: flex;
        flex-direction: column;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        min-height: 0;
      }
      .col.empty,
      .col.collapsed {
        flex-basis: 44px;
      }
      .col.empty .cards,
      .col.collapsed .cards {
        display: none;
      }
      .col.collapsed header {
        cursor: pointer;
      }
      .col.empty header,
      .col.collapsed header {
        writing-mode: vertical-rl;
        padding: 12px 0;
        align-items: center;
      }
      .col header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        color: var(--muted);
        font-weight: 500;
        cursor: pointer;
      }
      .col header .count {
        color: var(--faint);
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        border: 2px solid currentColor;
        flex: none;
      }
      .cards {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 0 6px 6px;
        overflow-y: auto;
      }
      .card {
        display: block;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 10px 12px;
        color: inherit;
        text-decoration: none;
        transition: background 0.1s;
      }
      .card:hover {
        background: var(--card-hover);
        border-color: #2e3036;
      }
      .card .meta {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--faint);
        font-size: 12px;
        margin-bottom: 4px;
      }
      .card .meta .ref {
        flex: 1;
      }
      .card .title {
        color: var(--text);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .card .tags {
        display: flex;
        gap: 4px;
        margin-top: 8px;
      }
      .tag {
        font-size: 11px;
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 0 6px;
      }
      .tag.run {
        color: var(--blue);
        border-color: #23405e;
      }
      .tag.warn {
        color: var(--yellow);
        border-color: #4a4026;
      }
      .card.running {
        border-color: #23405e;
        animation: pulse 2s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          border-color: var(--blue);
        }
      }
      .tag.err {
        color: var(--red);
        border-color: #4a2a2a;
      }
      #dash {
        flex: 1;
        overflow-y: auto;
        padding: 12px;
        display: none;
        flex-direction: column;
        gap: 8px;
      }
      body.dash #board {
        display: none;
      }
      body.dash #dash {
        display: flex;
      }
      body:not(.dash) .dash-only {
        display: none;
      }
      #log {
        flex: 1;
        overflow-y: auto;
        padding: 12px;
        display: none;
      }
      body.log #board {
        display: none;
      }
      body.log #log {
        display: block;
      }
      body:not(.log) .log-only {
        display: none;
      }
      #decide {
        flex: 1;
        overflow-y: auto;
        padding: 12px;
        display: none;
        flex-direction: column;
        gap: 8px;
      }
      body.decide #board {
        display: none;
      }
      body.decide #decide {
        display: flex;
      }
      body.decide nav > :not(#view) {
        display: none;
      }
      .q {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .q.held {
        opacity: 0.55;
      }
      .q .meta {
        color: var(--faint);
        font-size: 12px;
      }
      .q .meta a {
        color: var(--blue);
      }
      .q .ask {
        font-size: 14px;
        white-space: pre-wrap;
      }
      .q .opts {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .q .opts button {
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 4px 10px;
        font: inherit;
        cursor: pointer;
      }
      .q .opts button:hover {
        border-color: var(--accent);
      }
      .q .opts button.danger {
        color: var(--red);
      }
      .q .opts button.mute {
        color: var(--muted);
      }
      input[type="search"] {
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        font: inherit;
        padding: 4px 8px;
        width: 240px;
      }
      .badge {
        background: var(--red);
        color: var(--bg);
        border-radius: 8px;
        padding: 0 5px;
        margin-left: 4px;
        font-size: 11px;
        font-weight: 600;
      }
      #log table td {
        text-align: left;
        vertical-align: top;
      }
      #log td.msg {
        white-space: pre-wrap;
        word-break: break-word;
        max-width: 0;
        width: 100%;
      }
      #log td.nowrap {
        white-space: nowrap;
        color: var(--muted);
      }
      #log tr.error td.lv {
        color: var(--red);
      }
      #log tr.warn td.lv {
        color: var(--yellow);
      }
      .panel h2 {
        font-size: 12px;
        font-weight: 500;
        color: var(--muted);
        margin-bottom: 8px;
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .legend {
        display: flex;
        gap: 12px;
        font-weight: 400;
      }
      .legend span {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .sw {
        width: 8px;
        height: 8px;
        border-radius: 2px;
      }
      svg {
        display: block;
        width: 100%;
        overflow: visible;
      }
      svg text {
        fill: var(--faint);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }
      svg .grid {
        stroke: var(--border);
        stroke-width: 1;
      }
      #tip {
        position: fixed;
        pointer-events: none;
        background: var(--card-hover);
        border: 1px solid #2e3036;
        border-radius: 6px;
        padding: 6px 8px;
        font-size: 12px;
        display: none;
        z-index: 10;
        font-variant-numeric: tabular-nums;
      }
      #tip div {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      #tip b {
        margin-left: auto;
        padding-left: 12px;
        font-weight: 500;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-variant-numeric: tabular-nums;
      }
      th,
      td {
        text-align: right;
        padding: 4px 8px;
        border-bottom: 1px solid var(--border);
      }
      th {
        color: var(--muted);
        font-weight: 500;
      }
      th:first-child,
      td:first-child {
        text-align: left;
      }
    </style>
  </head>
  <body>
    <nav>
      <div class="seg" id="view">
        <button data-v="board">board</button><button data-v="dash">dashboard</button
        ><button data-v="log">log<span class="badge" id="errcount" hidden></span></button
        ><button data-v="decide">decide<span class="badge" id="decidecount" hidden></span></button>
      </div>
      <div class="seg dash-only" id="unit">
        <button data-v="day">day</button><button data-v="week">week</button>
      </div>
      <div class="seg log-only" id="range">
        <button data-v="h">1h</button><button data-v="d">1d</button><button data-v="w">1w</button
        ><button data-v="m">1m</button>
      </div>
      <div class="seg log-only" id="level">
        <button data-v="error">error</button><button data-v="warn">warn+</button
        ><button data-v="all">all</button>
      </div>
      <div class="seg log-only" id="group">
        <button data-v="on">grouped</button><button data-v="off">raw</button>
      </div>
      <select id="source" class="log-only">
        <option value="">source</option>
      </select>
      <input type="search" id="q" class="log-only" placeholder="filter (text / PR URL)" />
      <div class="kind" id="kind">
        <label><input type="checkbox" value="review" />review</label>
        <label><input type="checkbox" value="authored" />mine</label>
      </div>
      <select id="author">
        <option value="">author</option>
      </select>
    </nav>
    <main id="board"></main>
    <section id="dash"></section>
    <section id="log"></section>
    <section id="decide"></section>
    <div id="tip"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
